<title>Sravani Tangudu – Data Analyst Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#02040a;--navy:#081226;--card:#0b1a33;--line:#16305c;--blue:#2f7bff;--ice:#9cc4ff;--tx:#e8eefc;--mut:#8ea2c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#0d2350 0,transparent 60%),linear-gradient(#02040a,#050b1a 60%,#02040a);background-color:var(--bg);color:var(--tx);font:400 16px/1.65 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.1}
a{color:var(--ice)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--blue);color:#fff;padding:8px 12px;z-index:99}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);background:rgba(2,4,10,.72);backdrop-filter:blur(14px);border-bottom:1px solid #10244a}
nav b{font:700 18px Sora,sans-serif}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0}
nav a{color:var(--mut);text-decoration:none;font-size:14px;font-weight:500}nav a:hover{color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
@media(max-width:820px){.burger{display:block}nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#050b1a;padding:16px 24px;border-bottom:1px solid var(--line)}nav ul.open{display:flex}}
section{padding:clamp(72px,11vw,140px) clamp(18px,5vw,64px);max-width:1180px;margin:auto}
h2{font-size:clamp(30px,5vw,54px);font-weight:700;margin-bottom:12px}
.sub{color:var(--mut);max-width:60ch;margin:0 0 40px}
#hero{min-height:100svh;max-width:none;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:20px;padding-top:110px;position:relative}
#hero>div:first-child{transform:translateY(calc(var(--sy,0)*.12px))}
.name{font-size:clamp(44px,8.4vw,116px);font-weight:700;letter-spacing:-.03em}
.name span{display:inline-block;opacity:0;transform:translateY(60%) rotateX(-50deg);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes up{to{opacity:1;transform:none}}
.role{font:300 clamp(18px,2.4vw,28px) Sora,sans-serif;color:var(--ice);margin:20px 0 10px}
.role i{display:inline-block;width:2px;height:1em;background:var(--blue);margin-left:4px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.viz{height:min(70vh,560px);min-height:320px;transform:translateY(calc(var(--sy,0)*-.08px))}
.viz canvas{width:100%!important;height:100%!important}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font:600 15px Manrope,sans-serif;text-decoration:none;border:1px solid var(--blue);cursor:pointer;transition:.25s;background:transparent;color:#fff;margin:6px 10px 6px 0}
.btn.p{background:var(--blue);box-shadow:0 0 30px #2f7bff55}.btn:hover{transform:translateY(-2px);background:#1e5fd6}
@media(max-width:900px){#hero{grid-template-columns:1fr;padding-top:96px}.viz{height:340px}}
.about{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:start}
.photo{border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 60px #2f7bff33}.photo img{display:block;width:100%;height:auto;transform:scale(1.02)}
@media(max-width:820px){.about{grid-template-columns:1fr}.photo{max-width:320px}}
.tl{border-left:2px solid var(--line);padding-left:20px;margin-top:28px}
.tl h3{font-size:19px}.tl small{color:var(--mut)}
.tl ul,.pj ul{color:var(--mut);padding-left:18px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cap{background:linear-gradient(160deg,var(--card),#060e20);border:1px solid var(--line);border-radius:18px;padding:24px;transition:.3s}
.cap:hover{border-color:var(--blue);transform:translateY(-4px)}
.cap h3{font-size:18px;margin-bottom:8px;color:var(--ice)}.cap p{margin:0;color:var(--mut);font-size:14.5px}
.pj{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:22px;overflow:hidden}
.pj>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:1fr 300px;gap:24px;padding:26px;cursor:pointer}
.pj>button:focus-visible{outline:2px solid var(--blue);outline-offset:-4px}
.pj h3{font-size:clamp(20px,2.6vw,28px);margin-bottom:8px}.pj p{margin:0 0 12px;color:var(--mut)}
.chip{display:inline-block;font-size:12.5px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;margin:0 6px 6px 0;color:var(--ice);background:#0a1a38}
.mock{position:relative;background:#050d1e;border:1px dashed #2a4a86;border-radius:14px;padding:10px}
.mock svg{width:100%;height:auto;display:block;transition:.4s}.pj>button:hover .mock svg{transform:scale(1.04)}
.tag{font-size:11px;color:#ffd58a;margin-top:8px;line-height:1.35}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s}.more.o{grid-template-rows:1fr}
.more>div{overflow:hidden;padding:0 26px}.more.o>div{padding:0 26px 26px}
.tog{color:var(--blue);font-weight:600;font-size:14px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.pj>button{grid-template-columns:1fr}}
.note{border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--mut)}
footer{text-align:center;color:var(--mut);padding:40px 20px 60px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.name span,.rv{opacity:1;transform:none}}
</style></head>
